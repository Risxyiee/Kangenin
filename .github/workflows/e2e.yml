name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
# Specs Playwright sudah ada (tests/e2e/*) dan semua journey menciptakan data
# uji ber-tanda "QA Bot" lalu MENGEMBEHKANNYA sendiri (kado: DELETE publik;
# confess: aksi admin "sapu-qa" via secret E2E_ADMIN_KEY — pasang di repo
# Settings → Secrets → Actions supaya cleanup otomatis).
# Jalannya hanya di push main + tombol manual; tunggu deploy Cloudflare dulu
# supaya tidak menembak versi lama tengah penggantian.

jobs:
  e2e:
    # App anonim tanpa auth — tes menembak produksi langsung (gratis, masa uji).
    # Data uji ditandai "QA Bot"/"Penerima Uji"; rate limit 5 create/15 menit/IP
    # aman karena workers: 1.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps
      - name: Tunggu deploy Cloudflare selesai (push = deploy baru berjalan)
        if: github.event_name == 'push'
        run: sleep 180
      - name: Run E2E (produksi)
        run: npm run test:e2e:ci
        env:
          E2E_BASE_URL: https://www.kangenin.web.id
          E2E_ADMIN_KEY: ${{ secrets.E2E_ADMIN_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
